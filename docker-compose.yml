version: "3.8"

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "55555:55555"
    volumes:
      - server_data:/app/server/
    environment:
      - HOST=0.0.0.0
      - PORT=55555
      - JWT_SECRET=your_production_secret_here
    restart: unless-stopped

volumes:
  server_data:
